name: Feature request
description: Propose one focused user-facing improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: What task is blocked today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Smallest useful solution
    validations:
      required: true
  - type: checkboxes
    id: boundaries
    attributes:
      label: Safety boundaries
      options:
        - label: This does not request CAPTCHA solving, fingerprint spoofing, stealth, proxy rotation, or security-control bypass.
          required: true
